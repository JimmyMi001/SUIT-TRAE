name: CI / 部署检查

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # =========================================
  # 1) 基本检查:Node 版本 + 依赖装得起来 + 启动服务
  # =========================================
  test:
    name: 基础检查
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 语法检查
        run: |
          node --check server.js && echo "OK server.js"
          node --check env-loader.js && echo "OK env-loader.js"
          node --check scripts/encrypt-env.js && echo "OK encrypt-env.js"

      - name: 启动服务 + 健康检查
        run: |
          (npm start &) ; sleep 8
          curl -sS -o /dev/null -w "GET /          -> HTTP %{http_code}\n" http://localhost:3000/
          curl -sS -o /dev/null -w "GET /api/health -> HTTP %{http_code}\n" http://localhost:3000/api/health
          pkill -f "node server.js" || true

  # =========================================
  # 2) 密钥扫描 (排除占位符,只查真实密钥模式)
  # =========================================
  secret-scan:
    name: 密钥泄漏扫描
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 扫描真实的高德 key (32位十六进制)
        run: |
          echo "=== 扫描: 真实高德 key 模式 (32位十六进制) ==="
          HITS=$(git ls-files | grep -vE "(\.env\.enc|\.env\.example|node_modules|\.bak|package-lock\.json|server\.js\.bak)" \
            | xargs grep -lE "AMAP_KEY\s*=\s*['\"]?[a-f0-9]{30,}['\"]?" 2>/dev/null || true)
          if [ -n "$HITS" ]; then
            echo "FAIL: 发现疑似真实高德 key"
            echo "$HITS"
            exit 1
          fi
          echo "OK: 未发现真实高德 key"

      - name: 扫描真实的 sk- 格式 key
        run: |
          echo "=== 扫描: 真实 sk- 格式 (DeepSeek/OpenAI 等) ==="
          HITS=$(git ls-files | grep -vE "(\.env\.enc|\.env\.example|node_modules|\.bak)" \
            | xargs grep -lE "sk-[a-f0-9]{30,}" 2>/dev/null || true)
          if [ -n "$HITS" ]; then
            echo "FAIL: 发现疑似真实 sk- 格式 key"
            echo "$HITS"
            exit 1
          fi
          echo "OK: 未发现真实 sk- 格式 key"

      - name: 扫描 GitHub PAT (ghp_/ghs_)
        run: |
          echo "=== 扫描: GitHub PAT ==="
          HITS=$(git ls-files | grep -vE "(\.env\.enc|\.env\.example|node_modules|\.bak)" \
            | xargs grep -lE "(ghp_|ghs_|gho_|ghu_|ghr_)[A-Za-z0-9]{30,}" 2>/dev/null || true)
          if [ -n "$HITS" ]; then
            echo "FAIL: 发现疑似 GitHub PAT"
            echo "$HITS"
            exit 1
          fi
          echo "OK: 未发现 GitHub PAT"

  # =========================================
  # 3) 验证 .env 不入仓、.env.enc 是密文
  # =========================================
  verify-encryption:
    name: 验证密钥加密
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 确认 .env / .env.keys 未入仓
        run: |
          echo "=== 入仓的 .env* 文件 ==="
          git ls-files | grep -E "\.env" || echo "(无)"
          if git ls-files | grep -qE "^\.env$|^\.env\.keys$"; then
            echo "FAIL: 发现明文 .env 或 .env.keys 入仓!"
            exit 1
          fi
          echo "OK: .env / .env.keys 未入仓"

      - name: 确认 .env.enc 是密文
        run: |
          if [ -f .env.enc ]; then
            SIZE=$(stat -c%s .env.enc)
            echo "INFO: .env.enc 大小: $SIZE bytes"
            # 密文不应该包含明文关键词
            if grep -qE "AMAP_KEY=9690b060|9690b060d496|DEEPSEEK_KEY=sk-1279027" .env.enc; then
              echo "FAIL: .env.enc 似乎包含明文!"
              exit 1
            fi
            echo "OK: .env.enc 是密文,未发现明文"
          else
            echo "SKIP: .env.enc 不存在"
          fi
