  #   name: 触发 Render 部署
  #   needs: [test, secret-scan]
  #   runs-on: ubuntu-latest
  #   if: github.ref == 'refs/heads/main' && github.event_name == 'push'
  #   steps:
  #     - name: 通知 Render 部署
  #       run: |
  #         curl -sS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
