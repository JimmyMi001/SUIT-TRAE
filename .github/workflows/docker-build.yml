name: Docker 构建 & 推送

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '.vscode/**'
  workflow_dispatch:

jobs:
  build-and-push:
    name: 构建镜像 → 推送到 ghcr.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 转换镜像名为小写（Docker 要求）
        run: |
          echo "IMAGE_LOWER=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker 构建 & 推送
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_LOWER }}:latest
            ${{ env.IMAGE_LOWER }}:${{ github.sha }}
          build-args: |
            NODE_ENV=production
