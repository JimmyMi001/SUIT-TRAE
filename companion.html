<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>旅途中 — 123就出发</title>
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/companion.css">
</head>
<body>

  <nav class="nav">
    <a href="/" class="nav__logo">123就出发</a>
    <div class="nav__actions">
      <button class="nav__icon-btn" aria-label="设置">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      <div class="nav__avatar" title="旅人">旅</div>
    </div>
  </nav>

  <main class="companion">

    <!-- 顶部状态栏 -->
    <div class="status-bar">
      <div class="status-bar__loc">
        <div class="status-bar__pin">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
        </div>
        <div>
          <div class="status-bar__city" id="statusCity">广州市 · 越秀区</div>
          <div class="status-bar__dist">距下一个 POI 1.2 km</div>
        </div>
      </div>
      <div class="status-bar__weather">
        <svg class="status-bar__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <span class="status-bar__temp">28°</span>
        <span style="font-size: 0.7rem; color: var(--c-text-2)">晴</span>
      </div>
    </div>

    <!-- 快捷操作 2x3 -->
    <section class="quick-section">
      <div class="section-title">快捷操作</div>
      <div class="quick-grid">
        <button class="quick-btn">
          <div class="quick-btn__icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11h18M5 11V8a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v3M7 17v2M17 17v2M5 11l1 8h12l1-8"/></svg>
          </div>
          <span class="quick-btn__label">附近美食</span>
        </button>
        <button class="quick-btn">
          <div class="quick-btn__icon quick-btn__icon--teal">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22v-7M9 9V5a3 3 0 0 1 6 0v4M7 9h10l1 4H6l1-4zM8 15h8"/></svg>
          </div>
          <span class="quick-btn__label">找厕所</span>
        </button>
        <button class="quick-btn">
          <div class="quick-btn__icon quick-btn__icon--warning">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0zM12 9v4M12 17h.01"/></svg>
          </div>
          <span class="quick-btn__label">天气预警</span>
        </button>
        <button class="quick-btn">
          <div class="quick-btn__icon quick-btn__icon--info">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8M12 6v2M12 16v2"/></svg>
          </div>
          <span class="quick-btn__label">实时汇率</span>
        </button>
        <button class="quick-btn">
          <div class="quick-btn__icon quick-btn__icon--purple">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg>
          </div>
          <span class="quick-btn__label">航班动态</span>
        </button>
        <button class="quick-btn">
          <div class="quick-btn__icon quick-btn__icon--danger">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          </div>
          <span class="quick-btn__label">紧急求助</span>
        </button>
      </div>
    </section>

    <!-- 一键应急 -->
    <section class="emergency">
      <div class="section-title">一键应急</div>
      <div class="emergency__grid">
        <button class="emergency-btn emergency-btn--red">
          <span class="emergency-btn__num">120</span>
          <span>最近医院</span>
        </button>
        <button class="emergency-btn emergency-btn--blue">
          <span class="emergency-btn__num">110</span>
          <span>报警</span>
        </button>
        <button class="emergency-btn emergency-btn--green">
          <span class="emergency-btn__num">↗</span>
          <span>回酒店</span>
        </button>
      </div>
    </section>

    <!-- 对话区 -->
    <section class="companion__chat">
      <div class="section-title">智能问答</div>
      <div class="companion__messages" id="chatMessages">
        <div class="companion__msg companion__msg--agent">
          <div class="companion__avatar">AI</div>
          <div class="companion__bubble">
            你好，附近有 <b>3 家</b>人均 80 元的川菜馆，要看哪家？<br>
            <span style="color:var(--c-text-3);font-size:0.8rem">推荐：陈麻婆豆腐（距 280m，4.5⭐）</span>
          </div>
        </div>
      </div>

      <!-- 快速回复模板 -->
      <div class="companion__templates">
        <button class="template-chip" data-q="附近有什么好吃的？">附近有什么好吃的？</button>
        <button class="template-chip" data-q="帮我翻译一下">帮我翻译一下</button>
        <button class="template-chip" data-q="还有多远到酒店？">还有多远到酒店？</button>
        <button class="template-chip" data-q="帮我叫一辆车去机场">帮我叫一辆车去机场</button>
        <button class="template-chip" data-q="查询天气">明天会下雨吗？</button>
      </div>

      <div class="companion__input-wrap">
        <div class="companion__input-box">
          <input class="companion__input" id="chatInput" type="text" placeholder="问我任何事…">
          <button class="chat__voice" aria-label="语音">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3"/></svg>
          </button>
          <button class="chat__send" id="sendBtn" aria-label="发送">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m22 2-7 20-4-9-9-4Z"/></svg>
          </button>
        </div>
      </div>
    </section>

  </main>

  <script src="js/companion.js"></script>
</body>
</html>
